services:
  capability-api:
    build: .
    image: capability-token-api:latest
    container_name: capability-token-api
    ports:
      - "8000:8000"
    environment:
      # Override these in .env or your shell. A default dev keyring is
      # shipped in .env.example so the stack runs out of the box; rotate it
      # for real use.
      #
      # CAPABILITY_KEYRING is an ORDERED comma-separated list of
      # kid:secret entries: the first entry signs new tokens; every entry
      # verifies tokens carrying its kid (zero-downtime rotation). Retired
      # kids are kept here until all tokens signed with them have expired.
      CAPABILITY_KEYRING: ${CAPABILITY_KEYRING:-2026-09:dev-insecure-key-2026-09-change-me-0123456789,2026-01:dev-insecure-key-2026-01-change-me-0123456789}
      # Only key accepted for tokens issued before keyring support (no kid).
      CAPABILITY_LEGACY_SECRET: ${CAPABILITY_LEGACY_SECRET:-dev-insecure-legacy-secret-change-me-0123456789}
      # Deprecated: works on its own as a single-key setup, but must not be
      # combined with CAPABILITY_KEYRING (startup rejects the conflict).
      CAPABILITY_SECRET: ${CAPABILITY_SECRET:-}
      CAPABILITY_ISSUER_KEY: ${CAPABILITY_ISSUER_KEY:-}
      CAPABILITY_ADMIN_KEY: ${CAPABILITY_ADMIN_KEY:-}
      CAPABILITY_DB_PATH: /data/capabilities.db
      CAPABILITY_FILES_DIR: /app/files
      CAPABILITY_DEFAULT_TTL: ${CAPABILITY_DEFAULT_TTL:-300}
      CAPABILITY_MAX_TTL: ${CAPABILITY_MAX_TTL:-3600}
    volumes:
      - capability-data:/data
      - ./files:/app/files:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  capability-data:
